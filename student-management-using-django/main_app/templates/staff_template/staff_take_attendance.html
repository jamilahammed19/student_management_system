{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}

<section class="content py-5" style="background-color: #f4f6f9;">
    <div class="container-fluid">
        <div class="row justify-content-center">
            
            <div class="col-md-8">
                
                <div class="card border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
                    
                    <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-white text-primary rounded-circle d-flex align-items-center justify-content-center mr-3" style="width: 40px; height: 40px;">
                                <i class="fas fa-calendar-check"></i>
                            </div>
                            <h3 class="card-title m-0 text-white font-weight-bold">{{page_title}}</h3>
                        </div>
                    </div>

                    <div class="card-body p-5 bg-white">
                        
                        <div class="alert alert-light border shadow-sm mb-4" role="alert">
                            <i class="fas fa-info-circle text-info mr-2"></i> 
                            <span class="text-muted small">Select the Subject and Session below to load the student list for attendance.</span>
                        </div>

                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-muted text-uppercase small">Subject</label>
                            <select name="subject" class="form-control form-control-lg border-2 shadow-sm" id='subject' style="border-radius: 10px;">
                                <option value="">-- Select Subject --</option>
                                {% for subject in subjects  %}
                                <option value="{{subject.id}}">{{subject.name}}</option>
                                {% endfor %}
                            </select>
                        </div>


                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-muted text-uppercase small">Session Year</label>
                            <select name="session" id='session' class="form-control form-control-lg border-2 shadow-sm" style="border-radius: 10px;">
                                <option value="">-- Select Session --</option>
                                {% for session in sessions  %}
                                <option value="{{session.id}}">{{session}} </option>
                                {% endfor %}
                            </select>
                        </div>

                    </div>
                    <div class="card-footer bg-white border-0 p-4">
                        <button type="button" id='fetch_student' class="btn btn-primary btn-block btn-lg shadow-sm" style="border-radius: 10px;">
                            <i class="fas fa-search mr-2"></i> Fetch Students
                        </button>
                        
                        <div class="mt-4" id="student_data"></div>
                    </div>
                </div>
                </div>
        </div>
    </div>
</section>
{% endblock content %}


{% block custom_js %}
<script>
    $(document).ready(function () {

       
        $("#fetch_student").click(function () {
            var subject = $("#subject").val()
            var session = $("#session").val()
            $("#student_data").html(null)
            
            if (subject.length  == 0 || session.length == 0){
                alert("Please select session and subject");
                return false;
            }

            $.ajax({
                url: "{% url 'get_students' %}",
                type: 'POST',
                data: {
                    subject: subject,
                    session: session
                }
            }).done(function (response) {
                var json_data = JSON.parse(response)
                if (json_data.length < 1) {
                    alert("No data to display")
                } else {
                    // REDESIGNED DYNAMIC HTML GENERATION
                    var div_data = "<div class='form-group mb-4 animate__animated animate__fadeIn'><label class='font-weight-bold text-muted text-uppercase small'>Attendance Date</label><input type='date' class='form-control form-control-lg border-2 shadow-sm' name='attendance_date' id='attendance_date' style='border-radius: 10px;'></div>"
                    
                    div_data += "<div class='form-group mb-2'><label class='font-weight-bold text-muted text-uppercase small'>Student List</label></div>"
                    
                    div_data += "<div class='row animate__animated animate__fadeInUp'>"

                    for (key in json_data) {
                        // Creating card-like checkboxes for better UI
                        div_data += "<div class='col-lg-6 mb-3'>"
                        div_data += "<div class='card shadow-sm border-0 bg-light h-100'>"
                        div_data += "<div class='card-body p-3 d-flex align-items-center'>"
                        div_data += "<div class='custom-control custom-checkbox'>"
                        div_data += "<input type='checkbox' class='custom-control-input' checked='checked' name='student_data[]' value=" + json_data[key]['id'] + " id='checkbox" + json_data[key]['id'] + "' />"
                        div_data += "<label for='checkbox" + json_data[key]['id'] + "' class='custom-control-label font-weight-bold text-dark ml-2' style='cursor:pointer;'>" + json_data[key]['name'] + "</label>"
                        div_data += "</div></div></div></div>"
                    }
                    div_data += "</div>"
                    
                    div_data += "<div class='form-group mt-4'><button id='save_attendance' class='btn btn-success btn-block btn-lg shadow-sm' style='border-radius: 10px;' type='button'><i class='fas fa-save mr-2'></i> Save Attendance</button></div>"
                    
                    $("#student_data").html(div_data)
                }
            }).fail(function (response) {
                alert("Error in fetching students")
            })


            $(document).on('click', '#save_attendance', function () {
                $(this).attr("disabled","disabled")
                $(this).html("<i class='fas fa-spinner fa-spin mr-2'></i> Saving Data...") // Added spinner icon
                var student_data = $("input[name='student_data[]']").map(function () {
                    if ($(this).is(":checked")){
                    return {'id':$(this).val(), 'status': 1};
    
                    }
                    return {'id':$(this).val(), 'status': 0};
    
                }).get()
                var attendance_date = $('#attendance_date').val()
                if (attendance_date.length < 10){
                    alert("Select date")
                    return false;
                }
                student_data = JSON.stringify(student_data)
                $.ajax({
                    url: "{% url 'save_attendance' %}",
                    type: 'POST',
                    data: {
                        date: attendance_date,
                        student_ids: student_data,
                        subject: subject,
                        session: session
            
                    }
                }).done(function (response) {
                    if (response == 'OK'){
                        alert("Saved")
                    }else{
                        alert("Error. Please try again")
                    }
                    location.reload()
                    
                }).fail(function (response) {
                    alert("Error in saving attendance")
                })
    
            })


        })
    })
</script>
{% endblock custom_js %}
