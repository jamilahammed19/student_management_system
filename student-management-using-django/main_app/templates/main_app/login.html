{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Ideal School and College | Log in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Consistent Gradient */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            margin: 0;
        }

        .card {
            border: none;
            border-radius: 20px; /* Rounded Card */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .card-header {
            background-color: #fff;
            border-bottom: none;
            padding-top: 30px;
            text-align: center;
        }

        .login-logo a {
            color: #764ba2;
            font-weight: 700;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-logo i {
            display: block;
            font-size: 3rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(#667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card-body {
            padding: 30px 40px;
        }

        .login-box-msg {
            color: #6c757d;
            font-weight: 500;
        }

        /* Input Styling */
        .input-group .form-control {
            border-radius: 50px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            padding-left: 20px;
            height: 45px;
            font-size: 0.9rem;
        }

        .input-group-text {
            border-radius: 50px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            background-color: #fff;
            border-left: 0;
            color: #764ba2;
            padding-right: 20px;
        }
        
        .form-control:focus + .input-group-append .input-group-text,
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: none;
        }

        /* Button Styling */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            height: 45px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Checkbox & Link */
        .icheck-primary label {
            color: #6c757d;
            font-weight: 500;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .forgot-link {
            color: #764ba2;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body class="hold-transition login-page">
    <div class="login-box">
        
        <div class="card">
            <div class="card-header">
                <div class="login-logo">
                    <a href="../../index2.html">
                        <i class="fas fa-graduation-cap"></i>
                        Ideal School & College
                    </a>
                </div>
            </div>

            <div class="card-body login-card-body">
                <p class="login-box-msg">Welcome back! Please sign in.</p>

                {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                    {% if message.tags == 'error' %}
                    <div class="alert alert-danger text-center shadow-sm" style="border-radius: 10px; font-size: 0.9rem;">
                        <i class="fas fa-exclamation-circle mr-1"></i> {{message}}
                    </div>
                    {% endif %}
                    {% endfor %}
                </div>
                {% endif %}

                <form action="doLogin/" method="post">
                    {% csrf_token %}
                    
                    <div class="input-group mb-3">
                        <input required type="email" name='email' class="form-control" placeholder="Email Address">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="input-group mb-3">
                        <input required type="password" name='password' class="form-control" placeholder="Password">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row align-items-center mt-4">
                        <div class="col-7">
                            <div class="icheck-primary">
                                <input type="checkbox" id="remember">
                                <label for="remember">
                                    Remember Me
                                </label>
                            </div>
                        </div>
                        <div class="col-5">
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </div>
                        </div>
                </form>

                <a href="{% url 'password_reset' %}" class="forgot-link">I forgot my password</a>

            </div>
            </div>
    </div>
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'dist/js/adminlte.min.js' %}"></script>

</body>

</html>
