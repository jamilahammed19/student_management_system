<style>
    /* Scoped styling to ensure Django form widgets look modern */
    .form-group label {
        font-weight: 600;
        color: #34495e;
        margin-bottom: 8px;
    }

    /* Target standard HTML inputs generated by Django */
    .card-body input[type="text"], 
    .card-body input[type="email"], 
    .card-body input[type="password"], 
    .card-body input[type="number"], 
    .card-body input[type="url"], 
    .card-body input[type="date"], 
    .card-body select, 
    .card-body textarea,
    .form-control {
        display: block;
        width: 100%;
        height: 45px; /* Taller inputs */
        padding: 6px 12px;
        font-size: 1rem;
        line-height: 1.5;
        color: #495057;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 10px; /* Modern rounded corners */
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }

    /* Fix height for textareas */
    .card-body textarea {
        height: auto;
        min-height: 100px;
    }

    /* Fix height for file inputs */
    .card-body input[type="file"] {
        height: auto;
        padding: 10px;
        border: 1px dashed #ced4da;
        background-color: #f8f9fa;
    }

    /* Focus State */
    .card-body input:focus, 
    .card-body select:focus, 
    .card-body textarea:focus {
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    /* Error Styling */
    .errorlist {
        list-style: none;
        padding: 0;
        margin: 5px 0 0 0;
        color: #dc3545;
        font-size: 0.875em;
        font-weight: 500;
    }

    /* Help Text */
    .helptext {
        display: block;
        margin-top: 5px;
        font-size: 0.85em;
        color: #6c757d;
    }

    /* Checkbox special case */
    .card-body input[type="checkbox"] {
        width: auto;
        height: auto;
        margin-right: 10px;
        transform: scale(1.2);
    }
</style>

<form role="form" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="card-body p-4">
        
        {% for field in form %}
        <div class="form-group mb-4">
            {{ field.label_tag }}
            
            {{ field }}
            
            {% if field.errors %}
                <div class="alert alert-danger border-0 p-2 mt-2 rounded">
                    {{ field.errors }}
                </div>
            {% endif %}
            
            {% if field.help_text %}
                <small class="form-text text-muted">{{ field.help_text }}</small>
            {% endif %}
        </div>
        {% endfor %}

    </div>
    <div class="card-footer bg-white border-0 pb-4 pr-4 pl-4">
        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-sm" 
                style="border-radius: 50px; background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); border: none;">
            {% if button_text %}
                {{ button_text }} <i class="fas fa-paper-plane ml-2"></i>
            {% else %}
                Submit <i class="fas fa-paper-plane ml-2"></i>
            {% endif %}
        </button>
    </div>
</form>
