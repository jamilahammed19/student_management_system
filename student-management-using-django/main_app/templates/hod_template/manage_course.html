{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}

{% block content %}

<section class="content py-5" style="background-color: #f4f6f9;">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-12">
                
                <div class="card border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
                    
                    <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <div class="d-flex align-items-center">
                            <h3 class="card-title m-0 text-white font-weight-bold">
                                <i class="fas fa-book-reader mr-2"></i> {{page_title}}
                            </h3>
                        </div>
                    </div>
                    
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table id="example2" class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="py-3 pl-4 text-uppercase text-muted small font-weight-bold" style="width: 80px;">SN</th>
                                        <th class="py-3 text-uppercase text-muted small font-weight-bold">Course Name</th>
                                        <th class="py-3 text-uppercase text-muted small font-weight-bold text-right pr-5">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for course in courses %}
                                    <tr style="border-bottom: 1px solid #f0f2f5;">
                                        <td class="pl-4 py-3 font-weight-bold text-muted">{{ forloop.counter }}</td>
                                        
                                        <td class="py-3">
                                            <span class="text-dark font-weight-bold" style="font-size: 1.05rem;">
                                                {{course.name}}
                                            </span>
                                        </td>
                                        
                                        <td class="py-3 text-right pr-4">
                                            <a href="{% url 'edit_course' course.id %}" class="btn btn-sm btn-info shadow-sm mr-1">
                                                <i class="fas fa-pencil-alt"></i> Edit
                                            </a>
                                            <a href="{% url 'delete_course' course.id %}" onclick="return confirm('Are you sure you want to delete this course ?')" class="btn btn-sm btn-danger shadow-sm">
                                                <i class="fas fa-trash"></i> Delete
                                            </a> 
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
        </div>
    </div>
</section>
{% endblock content %}
